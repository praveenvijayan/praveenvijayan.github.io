<svg xmlns="http://www.w3.org/2000/svg" width="660" height="372" viewBox="0 0 660 372" fill="none" role="img" aria-label="One Broapp application on one machine: the browser tab redeems a one-time launch token at the host's trust fence and gets a session cookie, fetches the single embedded document, then calls a typed operation which the fence admits and the host runs and answers; a request from another origin reaches the same fence and is refused with 403 before anything else runs.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 12s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 12s; }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 21.67% { opacity: 1; } 22.5%, 100% { opacity: 0; } }
    /* m1: tab opens the printed URL; the one-time token reaches the fence */
    @keyframes m1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3% { opacity: 1; }
      7.5% { transform: translate(200px, 0px); opacity: 1; }
      8.5%, 100% { transform: translate(200px, 0px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 7.5% { transform: scale(0.4); opacity: 0; } 7.83% { transform: scale(0.5); opacity: 0.8; } 11.67%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 7.5% { opacity: 0; } 8.17% { opacity: 0.3; } 10.83%, 100% { opacity: 0; } }
    /* m2: host sets the signed session cookie and redirects to / */
    @keyframes m2 {
      0%, 10% { transform: translate(0, 0); opacity: 0; }
      10.5% { opacity: 1; }
      10.51% { transform: translate(0px, 24px); }
      18.31% { transform: translate(-364px, 24px); }
      19.17% { transform: translate(-364px, -16px); opacity: 1; }
      20.17%, 100% { transform: translate(-364px, -16px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 19.17% { transform: scale(0.4); opacity: 0; } 19.5% { transform: scale(0.5); opacity: 0.8; } 23.33%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 19.17% { opacity: 0; } 19.83% { opacity: 0.3; } 22.5%, 100% { opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 22.5% { opacity: 0; } 23.33%, 43.33% { opacity: 1; } 44.17%, 100% { opacity: 0; } }
    /* m3: tab asks for / with the cookie; fence checks host, origin, cookie */
    @keyframes m3 {
      0%, 24.17% { transform: translate(0, 0); opacity: 0; }
      24.67% { opacity: 1; }
      29.17% { transform: translate(200px, 0px); opacity: 1; }
      30.17%, 100% { transform: translate(200px, 0px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 29.17% { transform: scale(0.4); opacity: 0; } 29.5% { transform: scale(0.5); opacity: 0.8; } 33.33%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 29.17% { opacity: 0; } 29.83% { opacity: 0.3; } 32.5%, 100% { opacity: 0; } }
    /* m4: one document, script and style inline, CSP pinned by hash */
    @keyframes m4 {
      0%, 31.67% { transform: translate(0, 0); opacity: 0; }
      32.17% { opacity: 1; }
      32.18% { transform: translate(0px, 24px); }
      39.98% { transform: translate(-364px, 24px); }
      40.83% { transform: translate(-364px, -16px); opacity: 1; }
      41.83%, 100% { transform: translate(-364px, -16px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 40.83% { transform: scale(0.4); opacity: 0; } 41.17% { transform: scale(0.5); opacity: 0.8; } 45%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m4-glow { 0%, 40.83% { opacity: 0; } 41.5% { opacity: 0.3; } 44.17%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 44.17% { opacity: 0; } 45%, 69.17% { opacity: 1; } 70%, 100% { opacity: 0; } }
    /* m5: UI calls a typed operation over the websocket */
    @keyframes m5 {
      0%, 45.83% { transform: translate(0, 0); opacity: 0; }
      46.33% { opacity: 1; }
      50.83% { transform: translate(200px, 0px); opacity: 1; }
      51.83%, 100% { transform: translate(200px, 0px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 50.83% { transform: scale(0.4); opacity: 0; } 51.17% { transform: scale(0.5); opacity: 0.8; } 55%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 50.83% { opacity: 0; } 51.5% { opacity: 0.3; } 54.17%, 100% { opacity: 0; } }
    /* m6: admitted; input validated on the host before the handler runs */
    @keyframes m6 {
      0%, 53.33% { transform: translate(0, 0); opacity: 0; }
      53.83% { opacity: 1; }
      55.83% { transform: translate(24px, 0px); opacity: 1; }
      56.83%, 100% { transform: translate(24px, 0px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 55.83% { transform: scale(0.4); opacity: 0; } 56.17% { transform: scale(0.5); opacity: 0.8; } 60%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6-glow { 0%, 55.83% { opacity: 0; } 56.5% { opacity: 0.3; } 59.17%, 100% { opacity: 0; } }
    /* m7: result goes back to the tab */
    @keyframes m7 {
      0%, 58.33% { transform: translate(0, 0); opacity: 0; }
      58.83% { opacity: 1; }
      58.85% { transform: translate(0px, 24px); }
      66.64% { transform: translate(-364px, 24px); }
      67.5% { transform: translate(-364px, -16px); opacity: 1; }
      68.5%, 100% { transform: translate(-364px, -16px); opacity: 0; }
    }
    @keyframes m7-ring { 0%, 67.5% { transform: scale(0.4); opacity: 0; } 67.83% { transform: scale(0.5); opacity: 0.8; } 71.67%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m7-glow { 0%, 67.5% { opacity: 0; } 68.17% { opacity: 0.3; } 70.83%, 100% { opacity: 0; } }
    /* ph4: act 4 */
    @keyframes ph4 { 0%, 70% { opacity: 0; } 70.83%, 88.33% { opacity: 1; } 89.17%, 100% { opacity: 0; } }
    /* m8: a page on another origin, or another port, sends cross-site */
    @keyframes m8 {
      0%, 71.67% { transform: translate(0, 0); opacity: 0; }
      72.17% { opacity: 1; }
      77.07% { transform: translate(124px, 0px); }
      79.17% { transform: translate(124px, 48px); opacity: 1; }
      80.17%, 100% { transform: translate(124px, 48px); opacity: 0; }
    }
    @keyframes m8-ring { 0%, 79.17% { transform: scale(0.4); opacity: 0; } 79.5% { transform: scale(0.5); opacity: 0.8; } 83.33%, 100% { transform: scale(1.4); opacity: 0; } }
    /* refused: 403 before routing, before a body is read */
    @keyframes refused { 0%, 78.33% { opacity: 0; } 79.17%, 88.33% { opacity: 1; } 89.17%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="371" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">ONE PROCESS, ONE TAB</text>
  <text class="t-sub" x="28" y="66">Every request meets the trust fence before routing; nothing leaves the machine.</text>

  <!-- zone: the machine -->
  <rect x="28" y="104" width="604" height="196" rx="12" fill="none" stroke="#363840" stroke-dasharray="4 4"/>
  <text class="t-zone" x="44" y="122">YOUR MACHINE</text>

  <!-- host node: drawn before connectors so the fence's top port is visible -->
  <rect x="376" y="152" width="224" height="104" rx="7" fill="#141416" stroke="#363840"/>
  <text class="t-name" x="388" y="252">HOST · 127.0.0.1 · ONE EXECUTABLE</text>

  <!-- connectors -->
  <g stroke="#363840">
    <line x1="188" y1="200" x2="388" y2="200"/>
    <line x1="476" y1="212" x2="500" y2="212"/>
    <path d="M488,256 V272 Q488,280 480,280 H132 Q124,280 124,272 V240"/>
    <path d="M288,136 H404 Q412,136 412,144 V184"/>
  </g>
  <g fill="#363840">
    <polygon points="382,197 388,200 382,203"/>
    <polygon points="494,209 500,212 494,215"/>
    <polygon points="121,246 124,240 127,246"/>
    <polygon points="409,178 412,184 415,178"/>
  </g>

  <!-- browser -->
  <rect x="60" y="184" width="128" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="74" cy="201" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="84" y="204">BROWSER TAB</text>
  <text class="t-desc" x="72" y="224">one document · your UI</text>

  <!-- fence tile -->
  <rect x="388" y="184" width="88" height="56" rx="6" fill="#0D0D0E" stroke="#363840"/>
  <circle cx="402" cy="201" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="412" y="204">FENCE</text>
  <text class="t-desc" x="400" y="224">host · origin · cookie</text>

  <!-- operations tile -->
  <rect x="500" y="184" width="88" height="56" rx="6" fill="#0D0D0E" stroke="#363840"/>
  <circle cx="514" cy="201" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.4s"/>
  <text class="t-name" x="524" y="204">OPERATIONS</text>
  <text class="t-desc" x="512" y="224">validate · run</text>

  <!-- another origin -->
  <circle cx="288" cy="136" r="4" fill="#6F7987"/>
  <text class="t-small" x="276" y="140" text-anchor="end">ANOTHER ORIGIN · PAGE OR PORT</text>

  <!-- connector labels, 6–10 px clear of the stroke -->
  <text class="t-small" x="288" y="210" text-anchor="middle">REQUESTS</text>
  <text class="t-small" x="304" y="272" text-anchor="middle">REPLIES</text>

  <!-- refusal mark: appears at the fence when the foreign request lands -->
  <text class="t-tag story" x="424" y="176" fill="#FF9E9E" style="animation-name:refused;opacity:0">403 · REFUSED</text>

  <!-- caption -->
  <text class="t-prose" x="330" y="328" text-anchor="middle">Only a same-origin tab carrying the session cookie reaches an operation; the fence answers everything else.</text>

  <!-- @motion:elements -->
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · LAUNCH</text>
  <g class="pkt" style="animation-name:m1">
    <circle cx="188" cy="200" r="4" fill="#4CF490"/>
    <text class="t-tag" x="188" y="188" text-anchor="middle" fill="#4CF490">TOKEN</text>
  </g>
  <circle cx="388" cy="200" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="388" y="184" width="88" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m1-glow"/>
  <g class="pkt" style="animation-name:m2">
    <circle cx="488" cy="256" r="4" fill="#4CF490"/>
    <text class="t-tag" x="488" y="270" text-anchor="middle" fill="#4CF490">COOKIE</text>
  </g>
  <circle cx="124" cy="240" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="60" y="184" width="128" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m2-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph2;opacity:0">2 · SERVE</text>
  <g class="pkt" style="animation-name:m3">
    <circle cx="188" cy="200" r="4" fill="#4CF490"/>
    <text class="t-tag" x="188" y="188" text-anchor="middle" fill="#4CF490">GET /</text>
  </g>
  <circle cx="388" cy="200" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="388" y="184" width="88" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m3-glow"/>
  <g class="pkt" style="animation-name:m4">
    <circle cx="488" cy="256" r="4" fill="#4CF490"/>
    <text class="t-tag" x="488" y="270" text-anchor="middle" fill="#4CF490">DOCUMENT</text>
  </g>
  <circle cx="124" cy="240" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <rect x="60" y="184" width="128" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m4-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph3;opacity:0">3 · CALL</text>
  <g class="pkt" style="animation-name:m5">
    <circle cx="188" cy="200" r="4" fill="#4CF490"/>
    <text class="t-tag" x="188" y="188" text-anchor="middle" fill="#4CF490">CALL</text>
  </g>
  <circle cx="388" cy="200" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="388" y="184" width="88" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m5-glow"/>
  <circle cx="476" cy="212" r="4" fill="#4CF490" class="pkt" style="animation-name:m6"/>
  <circle cx="500" cy="212" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <rect x="500" y="184" width="88" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m6-glow"/>
  <g class="pkt" style="animation-name:m7">
    <circle cx="488" cy="256" r="4" fill="#4CF490"/>
    <text class="t-tag" x="488" y="270" text-anchor="middle" fill="#4CF490">RESULT</text>
  </g>
  <circle cx="124" cy="240" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m7-ring"/>
  <rect x="60" y="184" width="128" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m7-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#FF9E9E" style="animation-name:ph4;opacity:0">4 · REFUSED</text>
  <g class="pkt" style="animation-name:m8">
    <circle cx="288" cy="136" r="4" fill="#FF9E9E"/>
    <text class="t-tag" x="288" y="124" text-anchor="middle" fill="#FF9E9E">CROSS-SITE</text>
  </g>
  <circle cx="412" cy="184" r="10" fill="none" stroke="#FF9E9E" stroke-width="1.5" class="ring" style="animation-name:m8-ring"/>
  <!-- @/motion:elements -->

  <!-- legend strip -->
  <circle cx="36" cy="348" r="4" fill="#4CF490"/>
  <text class="t-name" x="46" y="352">YOUR UI · REQUESTS AND REPLIES</text>
  <circle cx="276" cy="348" r="4" fill="#FF9E9E"/>
  <text class="t-name" x="286" y="352">ANOTHER ORIGIN · REFUSED</text>
</svg>
