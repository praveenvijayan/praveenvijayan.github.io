  <circle cx="404" cy="292" r="10" fill="none" stroke="#02BEFA" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <rect x="404" y="264" width="184" height="56" rx="7" fill="#02BEFA" class="glow" style="animation-name:m6-glow"/>
  <g class="pkt" style="animation-name:m7">
    <circle cx="404" cy="292" r="4" fill="#02BEFA"/>
