  <circle cx="256" cy="292" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="72" y="264" width="184" height="56" rx="7" fill="#4CF490" class="glow" style="animation-name:m5-glow"/>
  <g class="pkt" style="animation-name:m6">
