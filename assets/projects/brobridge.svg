<svg xmlns="http://www.w3.org/2000/svg" width="660" height="464" viewBox="0 0 660 464" fill="none" role="img" aria-label="The browser tab presents its one-time launch token to the brobridge server and receives a session cookie, then upgrades to a single WebSocket that carries calls, stream data and flow-control credit in both directions. Finally any other page in the browser tries the same port and is refused by the trust fence.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 10s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 10s; }
    /* m1: tab presents the one-time launch token */
    @keyframes m1 {
      0%, 3% { transform: translate(0, 0); opacity: 0; }
      3.6% { opacity: 1; }
      9% { transform: translate(-148px, 0px); opacity: 1; }
      10.2%, 100% { transform: translate(-148px, 0px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 9% { transform: scale(0.4); opacity: 0; } 9.4% { transform: scale(0.5); opacity: 0.8; } 14%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 9% { opacity: 0; } 9.8% { opacity: 0.3; } 13%, 100% { opacity: 0; } }
    /* m2: 303 + HMAC session cookie, SameSite=Strict */
    @keyframes m2 {
      0%, 12% { transform: translate(0, 0); opacity: 0; }
      12.6% { opacity: 1; }
      18% { transform: translate(148px, 0px); opacity: 1; }
      19.2%, 100% { transform: translate(148px, 0px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 18% { transform: scale(0.4); opacity: 0; } 18.4% { transform: scale(0.5); opacity: 0.8; } 23%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 18% { opacity: 0; } 18.8% { opacity: 0.3; } 22%, 100% { opacity: 0; } }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
    /* m3: GET /ws upgrade with cookie, fence checks Host / Origin / Sec-Fetch-Site */
    @keyframes m3 {
      0%, 27% { transform: translate(0, 0); opacity: 0; }
      27.6% { opacity: 1; }
      33% { transform: translate(-148px, 0px); opacity: 1; }
      34.2%, 100% { transform: translate(-148px, 0px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 33% { transform: scale(0.4); opacity: 0; } 33.4% { transform: scale(0.5); opacity: 0.8; } 38%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 33% { opacity: 0; } 33.8% { opacity: 0.3; } 37%, 100% { opacity: 0; } }
    /* m4: 101 switching protocols, one socket for the tab */
    @keyframes m4 {
      0%, 36% { transform: translate(0, 0); opacity: 0; }
      36.6% { opacity: 1; }
      42% { transform: translate(148px, 0px); opacity: 1; }
      43.2%, 100% { transform: translate(148px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 42% { transform: scale(0.4); opacity: 0; } 42.4% { transform: scale(0.5); opacity: 0.8; } 47%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m4-glow { 0%, 42% { opacity: 0; } 42.8% { opacity: 0.3; } 46%, 100% { opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 24% { opacity: 0; } 25%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    /* m5: unary call on its own stream */
    @keyframes m5 {
      0%, 51% { transform: translate(0, 0); opacity: 0; }
      51.6% { opacity: 1; }
      57% { transform: translate(-148px, 0px); opacity: 1; }
      58.2%, 100% { transform: translate(-148px, 0px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 57% { transform: scale(0.4); opacity: 0; } 57.4% { transform: scale(0.5); opacity: 0.8; } 62%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 57% { opacity: 0; } 57.8% { opacity: 0.3; } 61%, 100% { opacity: 0; } }
    /* m6: binary stream data, raw bytes */
    @keyframes m6 {
      0%, 60% { transform: translate(0, 0); opacity: 0; }
      60.6% { opacity: 1; }
      66% { transform: translate(148px, 0px); opacity: 1; }
      67.2%, 100% { transform: translate(148px, 0px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 66% { transform: scale(0.4); opacity: 0; } 66.4% { transform: scale(0.5); opacity: 0.8; } 71%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6-glow { 0%, 66% { opacity: 0; } 66.8% { opacity: 0.3; } 70%, 100% { opacity: 0; } }
    /* m7: reader grants credit, only its own stream is paced */
    @keyframes m7 {
      0%, 68% { transform: translate(0, 0); opacity: 0; }
      68.6% { opacity: 1; }
      74% { transform: translate(-148px, 0px); opacity: 1; }
      75.2%, 100% { transform: translate(-148px, 0px); opacity: 0; }
    }
    @keyframes m7-ring { 0%, 74% { transform: scale(0.4); opacity: 0; } 74.4% { transform: scale(0.5); opacity: 0.8; } 79%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 48% { opacity: 0; } 49%, 76% { opacity: 1; } 77%, 100% { opacity: 0; } }
    /* m8: another page hits the port: no cookie, wrong origin, fence answers 403 */
    @keyframes m8 {
      0%, 78% { transform: translate(0, 0); opacity: 0; }
      78.6% { opacity: 1; }
      85.59% { transform: translate(-240px, 0px); }
      88% { transform: translate(-240px, -76px); opacity: 1; }
      89.2%, 100% { transform: translate(-240px, -76px); opacity: 0; }
    }
    @keyframes m8-ring { 0%, 88% { transform: scale(0.4); opacity: 0; } 88.4% { transform: scale(0.5); opacity: 0.8; } 93%, 100% { transform: scale(1.4); opacity: 0; } }
    /* ph4: act 4 */
    @keyframes ph4 { 0%, 76% { opacity: 0; } 77%, 89% { opacity: 1; } 90%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="463" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">BROBRIDGE ARCHITECTURE</text>
  <text class="t-sub" x="28" y="66">One tab bootstraps a session and holds one multiplexed socket; every other page is refused.</text>

  <!-- zones -->
  <rect x="28" y="104" width="272" height="240" rx="12" stroke="#363840" stroke-dasharray="4 4"/>
  <text class="t-zone" x="44" y="126">HOST PROCESS · NODE / BUN</text>
  <rect x="360" y="104" width="272" height="240" rx="12" stroke="#363840" stroke-dasharray="4 4"/>
  <text class="t-zone" x="376" y="126">YOUR TAB · SAME ORIGIN + COOKIE</text>

  <!-- connectors: draw before nodes so they sit behind -->
  <g stroke="#363840">
    <line x1="164" y1="216" x2="164" y2="264"/>
    <line x1="496" y1="216" x2="496" y2="264"/>
    <line x1="256" y1="292" x2="404" y2="292" stroke-width="1.5"/>
    <path d="M404,396 H172 Q164,396 164,388 V320" stroke-dasharray="4 3"/>
  </g>
  <g fill="#363840">
    <polygon points="161,258 164,264 167,258"/>
    <polygon points="493,258 496,264 499,258"/>
    <polygon points="262,289 256,292 262,295"/>
    <polygon points="398,289 404,292 398,295"/>
    <polygon points="161,326 164,320 167,326"/>
  </g>
  <text class="t-small" x="172" y="244">EXPOSE · STREAM</text>
  <text class="t-small" x="504" y="244">CALL · OPENSTREAM</text>
  <text class="t-small" x="328" y="308" text-anchor="middle">ONE WEBSOCKET</text>
  <text class="t-small" x="328" y="320" text-anchor="middle">MUX · CREDIT · RESUME</text>
  <text class="t-small" x="284" y="388" text-anchor="middle" fill="#FF9E9E">403 · TRUST FENCE</text>

  <!-- nodes -->
  <rect x="72" y="160" width="184" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="86" cy="177" r="2.5" fill="#4CF490" class="tick" style="animation-delay:0s"/>
  <text class="t-name" x="96" y="180">YOUR SERVICES</text>
  <text class="t-desc" x="84" y="200">expose(…) · stream(…) · any RPC framework on top</text>

  <rect x="72" y="264" width="184" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="86" cy="281" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.35s"/>
  <text class="t-name" x="96" y="284">BROBRIDGE SERVER</text>
  <text class="t-desc" x="84" y="304">trust fence · cookie auth · binds 127.0.0.1</text>

  <rect x="404" y="160" width="184" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="418" cy="177" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="428" y="180">YOUR UI</text>
  <text class="t-desc" x="416" y="200">birpc · oRPC · tRPC · or raw calls</text>

  <rect x="404" y="264" width="184" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="418" cy="281" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.05s"/>
  <text class="t-name" x="428" y="284">BRIDGE CLIENT</text>
  <text class="t-desc" x="416" y="304">reconnect · resume · backpressure · no deps</text>

  <rect x="404" y="368" width="184" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <text class="t-name" x="416" y="388">ANY-SITE.EXAMPLE</text>
  <text class="t-desc" x="416" y="408">every other page · no cookie · wrong origin</text>

  <!-- @motion:elements -->
  <g class="pkt" style="animation-name:m1">
    <circle cx="404" cy="292" r="4" fill="#4CF490"/>
    <text class="t-tag" x="404" y="280" text-anchor="middle" fill="#4CF490">TOKEN</text>
  </g>
  <circle cx="256" cy="292" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="72" y="264" width="184" height="56" rx="7" fill="#4CF490" class="glow" style="animation-name:m1-glow"/>
  <g class="pkt" style="animation-name:m2">
    <circle cx="256" cy="292" r="4" fill="#4CF490"/>
    <text class="t-tag" x="256" y="280" text-anchor="middle" fill="#4CF490">COOKIE</text>
  </g>
  <circle cx="404" cy="292" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="404" y="264" width="184" height="56" rx="7" fill="#4CF490" class="glow" style="animation-name:m2-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · BOOTSTRAP</text>
  <g class="pkt" style="animation-name:m3">
    <circle cx="404" cy="292" r="4" fill="#4CF490"/>
    <text class="t-tag" x="404" y="280" text-anchor="middle" fill="#4CF490">UPGRADE</text>
  </g>
  <circle cx="256" cy="292" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="72" y="264" width="184" height="56" rx="7" fill="#4CF490" class="glow" style="animation-name:m3-glow"/>
  <g class="pkt" style="animation-name:m4">
    <circle cx="256" cy="292" r="4" fill="#4CF490"/>
    <text class="t-tag" x="256" y="280" text-anchor="middle" fill="#4CF490">101</text>
  </g>
  <circle cx="404" cy="292" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <rect x="404" y="264" width="184" height="56" rx="7" fill="#4CF490" class="glow" style="animation-name:m4-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph2;opacity:0">2 · ONE SOCKET</text>
  <g class="pkt" style="animation-name:m5">
